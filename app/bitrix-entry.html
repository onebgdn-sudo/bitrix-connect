<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte Showbiz Entry</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top left, rgba(15, 102, 255, 0.08), transparent 24%),
        linear-gradient(180deg, #f3f7fb 0%, #edf3f8 100%);
      font-family: "Aptos", "Segoe UI", sans-serif;
      color: #1b2430;
    }

    .wrap {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .card {
      width: min(420px, 100%);
      padding: 22px;
      border-radius: 20px;
      background: #fff;
      border: 1px solid #d6dee7;
      box-shadow: 0 16px 40px rgba(15, 35, 60, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    p {
      margin: 0;
      color: #6a7684;
      line-height: 1.5;
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      padding: 0 12px;
      margin-bottom: 14px;
      border-radius: 999px;
      border: 1px solid rgba(15, 102, 255, 0.18);
      background: rgba(15, 102, 255, 0.08);
      color: #0f66ff;
      font-size: 12px;
      font-weight: 700;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1a8a4c;
      box-shadow: 0 0 0 3px rgba(26, 138, 76, 0.12);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="pill"><span class="dot"></span><span id="placement-label">Bitrix</span></div>
      <h1>Подключение Bitrix</h1>
      <p>Перенаправляю в основной интерфейс с сохранением placement-контекста.</p>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const placement = params.get('placement') || '';
    const label = placement
      ? (placement === 'LEFT_MENU' ? 'Левое меню Bitrix' : placement.startsWith('CRM_') ? 'CRM-контекст Bitrix' : placement)
      : 'Bitrix';
    const labelEl = document.getElementById('placement-label');
    if (labelEl) labelEl.textContent = label;

    const target = new URL('./index.html', location.href);
    target.search = location.search;
    target.hash = location.hash;

    const redirectToApp = () => setTimeout(() => {
      location.replace(target.toString());
    }, 60);

    const install = () => {
      if (!window.BX24 || typeof window.BX24.init !== 'function') {
        redirectToApp();
        return;
      }

      window.BX24.init(() => {
        const finish = typeof window.BX24.installFinish === 'function'
          ? window.BX24.installFinish.bind(window.BX24)
          : null;

        const bindPlacement = () => {
          if (!placement || typeof window.BX24.callMethod !== 'function') {
            redirectToApp();
            return;
          }

          window.BX24.callMethod(
            'placement.bind',
            {
              PLACEMENT: placement,
              HANDLER: target.toString(),
            },
            () => redirectToApp()
          );
        };

        if (finish) {
          try {
            finish();
          } catch (_) {}
        }

        bindPlacement();
      });
    };

    const sdk = document.createElement('script');
    sdk.src = 'https://api.bitrix24.com/api/v1/';
    sdk.async = true;
    sdk.onload = install;
    sdk.onerror = redirectToApp;
    document.head.appendChild(sdk);
  </script>
</body>
</html>
