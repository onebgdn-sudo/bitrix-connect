<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carte Showbiz</title>
  <style>
    :root {
      --bg: #edf2f7;
      --panel: #ffffff;
      --ink: #1b2430;
      --muted: #6a7684;
      --line: #d6dee7;
      --brand: #0f66ff;
      --brand-soft: rgba(15, 102, 255, 0.08);
      --shadow: 0 16px 40px rgba(15, 35, 60, 0.08);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(15, 102, 255, 0.10), transparent 24%),
        radial-gradient(circle at top right, rgba(46, 196, 182, 0.08), transparent 22%),
        linear-gradient(180deg, #f3f7fb 0%, #edf3f8 100%);
      color: var(--ink);
      font-family: "Aptos", "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 16px;
    }

    body.mobile-mode {
      padding: 0;
      background: linear-gradient(180deg, #f4f7fb 0%, #eef3f8 100%);
    }

    body.bitrix-mode {
      background:
        radial-gradient(circle at top left, rgba(15, 102, 255, 0.08), transparent 24%),
        linear-gradient(180deg, #f5f8fc 0%, #edf3f8 100%);
    }

    .shell {
      max-width: 1360px;
      margin: 0 auto;
      min-height: calc(100vh - 32px);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 14px;
    }

    body.bitrix-mode .shell {
      max-width: 1480px;
    }

    body.mobile-mode .shell {
      max-width: none;
      min-height: 100vh;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .header, .tabs, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .header {
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: linear-gradient(180deg, #0f66ff, #2ec4b6);
    }

    body.bitrix-mode .header {
      padding: 14px 16px;
    }

    body.bitrix-mode .tabs {
      padding: 8px;
    }

    .placement-banner {
      margin-top: -4px;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.92);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .placement-banner strong {
      display: block;
      color: var(--ink);
      font-size: 13px;
      margin-bottom: 2px;
    }

    body.bitrix-mode .placement-banner {
      background: rgba(255,255,255,0.95);
      border-color: rgba(15, 102, 255, 0.12);
    }

    h1, h2, h3, p { margin: 0; }

    h1 {
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(15, 102, 255, 0.18);
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1a8a4c;
      box-shadow: 0 0 0 3px rgba(26, 138, 76, 0.12);
    }

    .tabs {
      padding: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    body.mobile-mode .tabs {
      padding: 8px;
      position: sticky;
      top: 0;
      z-index: 8;
      backdrop-filter: blur(12px);
    }

    .tab {
      min-height: 38px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: #314155;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: var(--brand-soft);
      border-color: rgba(15, 102, 255, 0.18);
      color: var(--brand);
    }

    .panel {
      min-height: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.98)),
        var(--panel);
    }

    .view {
      min-height: 0;
      height: 100%;
      display: none;
    }

    .view.active { display: grid; }

    .chat-view {
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .contacts-view {
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .chat-top, .contacts-top {
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: linear-gradient(180deg, rgba(15, 102, 255, 0.03), transparent);
    }

    .chat-top .title, .contacts-top .title {
      font-size: 14px;
      font-weight: 700;
    }

    .messages {
      padding: 18px;
      display: grid;
      gap: 10px;
      align-content: start;
      min-height: 0;
      overflow: auto;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.70), rgba(255,255,255,0.86)),
        radial-gradient(circle at center top, rgba(15,102,255,0.03), transparent 45%);
    }

    .msg {
      max-width: min(760px, 92%);
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid transparent;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      margin-left: auto;
      background: linear-gradient(180deg, #1a72ff, #0f66ff);
      color: #fff;
      border-top-right-radius: 6px;
      box-shadow: 0 12px 24px rgba(15, 102, 255, 0.16);
    }

    .msg.bot {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
      border-top-left-radius: 6px;
    }

    .msg.system {
      max-width: 100%;
      background: #f7fafc;
      color: var(--muted);
      border-color: var(--line);
      font-size: 13px;
    }

    .msg.link {
      display: inline-block;
      color: var(--brand);
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .result-stack {
      display: grid;
      gap: 10px;
      white-space: normal;
    }

    .research-report {
      display: grid;
      gap: 12px;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .report-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .report-card.primary {
      background:
        radial-gradient(circle at top right, rgba(15,102,255,0.08), transparent 24%),
        linear-gradient(180deg, #fff, #fbfdff);
      border-color: rgba(15,102,255,0.16);
    }

    .report-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 800;
    }

    .report-value {
      color: var(--ink);
      font-size: 14px;
      line-height: 1.5;
      font-weight: 650;
    }

    .report-list {
      display: grid;
      gap: 8px;
    }

    .report-item {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, #fff, #fafcff);
      display: grid;
      gap: 4px;
    }

    .report-item small {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 800;
    }

    .report-item div {
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
    }

    .candidate-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .candidate-head {
      display: grid;
      gap: 3px;
    }

    .candidate-head b {
      font-size: 14px;
      color: var(--ink);
    }

    .candidate-head span,
    .candidate-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin: 0;
    }

    .score-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .score-pill {
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f7fafc;
      color: #415164;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
    }

    .composer {
      padding: 14px;
      display: grid;
      gap: 10px;
      border-top: 1px solid var(--line);
      background: #fff;
      position: sticky;
      bottom: 0;
      z-index: 5;
    }

    .input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }

    .textarea {
      width: 100%;
      min-height: 96px;
      resize: vertical;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font: inherit;
      color: var(--ink);
      outline: none;
      line-height: 1.45;
      background: #fff;
    }

    .textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 102, 255, 0.12);
    }

    .btn {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid var(--brand);
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .footer {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .contacts-toolbar {
      padding: 14px 18px;
      display: grid;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .search {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      font: inherit;
      color: var(--ink);
      outline: none;
      background: #fff;
    }

    .search:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(15, 102, 255, 0.12);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter {
      min-height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: #314155;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter.active {
      background: var(--brand-soft);
      border-color: rgba(15, 102, 255, 0.18);
      color: var(--brand);
    }

    .contacts-body {
      min-height: 0;
      overflow: auto;
      padding: 18px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .contacts-list {
      display: grid;
      gap: 12px;
    }

    .bitrix-context {
      display: grid;
      gap: 10px;
    }

    .bitrix-context-card {
      border: 1px solid rgba(15, 102, 255, 0.18);
      border-radius: 14px;
      background:
        radial-gradient(circle at top right, rgba(15,102,255,0.08), transparent 24%),
        linear-gradient(180deg, #fff, #f8fbff);
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .bitrix-context-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .bitrix-context-title {
      display: grid;
      gap: 3px;
    }

    .bitrix-context-title b {
      font-size: 14px;
      color: var(--ink);
    }

    .bitrix-context-title span,
    .bitrix-context-note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .bitrix-field-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .bitrix-field {
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .bitrix-field small {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 800;
    }

    .bitrix-field div {
      color: var(--ink);
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }

    .contact-item {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease;
    }

    .contact-item:hover {
      transform: translateY(-1px);
      border-color: rgba(15, 102, 255, 0.28);
      box-shadow: 0 12px 24px rgba(15, 35, 60, 0.08);
      background: linear-gradient(180deg, rgba(255,255,255,1), rgba(248,251,255,1));
    }

    .contact-item .photo {
      width: 84px;
      height: 84px;
      border-radius: 18px;
    }

    .contact-name {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .contact-role {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
      line-height: 1.45;
    }

    .contact-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-pill {
      min-height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      background: #f7fafc;
      border: 1px solid var(--line);
      color: #415164;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
    }

    .contact-arrow {
      color: var(--brand);
      font-weight: 800;
      font-size: 18px;
      padding: 0 4px;
    }

    .profile {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .photo {
      width: 132px;
      height: 132px;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #dfe8f3;
      flex: 0 0 auto;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35);
    }

    .photo img, .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .name-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 24px;
      line-height: 1.15;
    }

    .role {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: #324355;
      font-size: 12px;
      font-weight: 650;
    }

    .section {
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .kv {
      display: grid;
      gap: 4px;
    }

    .kv small {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 11px;
      font-weight: 700;
    }

    .kv div {
      line-height: 1.5;
      color: var(--ink);
    }

    .cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .cloud .node {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(15,102,255,0.16);
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .row-item {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      display: grid;
      gap: 4px;
    }

    .row-item b {
      font-size: 14px;
    }

    .row-item span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .post {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      display: grid;
      gap: 10px;
    }

    .post-top {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }

    .thumb {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      overflow: hidden;
      background: #e7edf5;
      border: 1px solid rgba(0,0,0,0.04);
      flex: 0 0 auto;
    }

    .post b {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .post p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .link-pill {
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(15,102,255,0.18);
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .line-link {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid rgba(15,102,255,0.18);
      background: var(--brand-soft);
      color: var(--brand);
      font-weight: 650;
      text-decoration: none;
    }

    .action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .secondary-btn {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: #314155;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(16, 26, 41, 0.42);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width: min(1240px, 100%);
      max-height: min(94vh, 1080px);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(10, 18, 28, 0.26);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .modal-top {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: linear-gradient(180deg, rgba(15, 102, 255, 0.03), transparent);
    }

    .modal-body {
      min-height: 0;
      overflow: auto;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(243,247,251,0.9), rgba(255,255,255,0.9));
    }

    .card-shell {
      display: grid;
      gap: 14px;
    }

    .card-hero {
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        radial-gradient(circle at top right, rgba(15,102,255,0.08), transparent 22%),
        radial-gradient(circle at left center, rgba(46,196,182,0.08), transparent 20%),
        #fff;
      box-shadow: 0 12px 28px rgba(15, 35, 60, 0.06);
      overflow: hidden;
    }

    .hero-top {
      padding: 16px;
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
    }

    .hero-visual {
      display: grid;
      gap: 10px;
      justify-items: start;
    }

    .visual-stack {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .visual-stack .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .visual-stack .photo.stack-back {
      transform: translate(10px, 10px) scale(0.9);
      opacity: 0.72;
      filter: saturate(0.9);
    }

    .visual-stack .photo.stack-mid {

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')

    function normalizeBitrixFields(raw) {
      if (!raw || typeof raw !== 'object') return {};

      return raw;
    }

    function asList(value) {
      if (Array.isArray(value)) return value.filter(Boolean);
      if (value === undefined || value === null || value === '') return [];
      return [value];

      const web = asList(fields.WEB).map(item => item?.VALUE || item?.value || item).filter(Boolean);
      const fullName = [fields.NAME, fields.SECOND_NAME, fields.LAST_NAME].filter(Boolean).join(' ').trim() || `Контакт #${fields.ID || '?'}`;
      const role = fields.POST || fields.COMPANY_TITLE || 'Контакт Bitrix';
      const company = fields.COMPANY_TITLE || '';
      const source = fields.SOURCE_ID || fields.TYPE_ID || 'crm';

    function bitrixCall(method, params = {}) {
      return new Promise((resolve, reject) => {
        if (!window.BX24 || typeof window.BX24.callMethod !== 'function') {
          reject(new Error('BX24 недоступен'));
          return;
        }
        try {
          window.BX24.callMethod(method, params, (result) => {
            try {
              if (result && typeof result.error === 'function') {
                const err = result.error();
                if (err) {
                  reject(new Error(err));
                  return;
                }
              }
              if (result && typeof result.data === 'function') {
                resolve(result.data());
                return;
              }
              if (result && typeof result.getData === 'function') {
                resolve(result.getData());
                return;
              }
              resolve(result?.result ?? result?.data ?? result);
            } catch (error) {
              reject(error);
            }
          });
        } catch (error) {
          reject(error);
        }
      });
    }

    function matchContacts(query) {
      const normalized = query.toLowerCase();
      return Object.values(data).filter(person => {
        const haystack = [person.name, person.role, person.summary, ...(person.tags || []), ...(person.links || []), ...(person.types || [])]
          .join(' ')
          .toLowerCase();
        return haystack.includes(normalized);
      });
    }

    function normalizeLookup(text) {
      return (text || '')
        .toLowerCase()
        .replace(/[^a-zа-яё0-9]+/gi, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function scoreKnownContacts(query) {
      const normalizedQuery = normalizeLookup(query);
      if (!normalizedQuery) return [];
      const exact = [];
      const fuzzy = [];

      Object.values(data).forEach(person => {
        const name = normalizeLookup(person.name);
        const alias = normalizeLookup(person.alias || '');
        const role = normalizeLookup(person.role || '');
        const summary = normalizeLookup(person.summary || '');
        const tags = normalizeLookup((person.tags || []).join(' '));
        const links = normalizeLookup((person.links || []).join(' '));
        const haystack = [name, alias, role, summary, tags, links].join(' ');
        if (normalizedQuery === name || normalizedQuery === alias || haystack.includes(normalizedQuery)) {
          const bucket = (normalizedQuery === name || normalizedQuery === alias) ? exact : fuzzy;
          bucket.push(person);
        }
      });

      return [...exact, ...fuzzy].filter((person, index, array) => array.findIndex(item => item.id === person.id) === index);
    }

    function looksLikeDirectContactLookup(query, person) {
      const normalizedQuery = normalizeLookup(query);
      const name = normalizeLookup(person.name);
      const alias = normalizeLookup(person.alias || '');
      if (!normalizedQuery) return false;
      if (normalizedQuery === name || normalizedQuery === alias) return true;
      return normalizedQuery.includes(name) && normalizedQuery.length <= name.length + 6;
    }

    function buildAttentionDigest() {
      const list = Object.values(data)
        .filter(person => person.communication && (person.communication.awaitingReply || person.communication.responsePriority >= 60))
        .map(person => ({
          person,
          score: Number(person.communication?.responsePriority || 0) + (person.communication?.awaitingReply ? 40 : 0) - Number(person.communication?.lastTouchDays || 0)
        }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 4);
      if (!list.length) return 'Срочных коммуникаций сейчас не видно.';
      return list.map(item => `• ${item.person.name} — ${item.person.communication.stageHint}, приоритет ${item.person.communication.responsePriority}/100, действие: ${item.person.communication.nextAction}`).join('\n');

        posts: [
          ['research', 'Исследовательская находка', candidate.whyFound || candidate.summary || 'Требует ручной проверки источников.'],
          ['source', 'Источники', (candidate.sources || []).join(', ') || 'Источники пока не подтверждены.']
        ],
        dossier: candidate.dossier || candidate.bitrixPreview || null,
        bitrixPreview: candidate.bitrixPreview || null,
        _candidate: candidate
      };
    }

    function rememberCandidates(candidates) {
      candidates.forEach(candidate => {
        const person = normalizeCandidate(candidate);
        data[person.id] = {
          ...(data[person.id] || {}),
          ...person,
          dossier: person.dossier || (data[person.id] && data[person.id].dossier) || null,
          bitrixPreview: person.bitrixPreview || (data[person.id] && data[person.id].bitrixPreview) || null
        };
      });
      renderContacts();
    }

    async function addCandidateToBitrix(candidateId) {
      const person = data[candidateId];
      if (!person) return;
      const candidate = person._candidate || {
        name: person.name,
        role: person.role,
        summary: person.summary,
        links: person.links,
        sources: person.links,
        confidence: 0.5
      };
      append('system', `Пробую добавить ${person.name} в Bitrix CRM.`);
      try {
        const response = await fetch('/api/bitrix/add-contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ candidate })
        });
        const result = await response.json();
        if (!response.ok || result.error) throw new Error(result.error || 'Bitrix вернул ошибку');
        append('bot', `${person.name} добавлен в Bitrix CRM.`);
      } catch (error) {
        append('bot', `Пока не смог добавить в Bitrix: ${error.message}. Контакт сохранен в локальном списке приложения.`);
      }
    }

    function renderCandidateResults(candidates) {
      if (!candidates.length) return '';
      const cards = candidates.map(candidate => {
        const person = normalizeCandidate(candidate);
        return `
          <div class="candidate-card">
            <div class="candidate-head">
              <b>${person.name}</b>
              <span>${person.role}</span>
            </div>
            <p>${candidate.whyFound || person.summary}</p>
            <div class="score-row">
              <span class="score-pill">релевантность ${candidate.relevance || 60}</span>
              <span class="score-pill">значимость ${candidate.importance || 50}</span>
              <span class="score-pill">${Math.round((candidate.confidence || 0.5) * 100)}% confidence</span>
            </div>
            <div class="action-row">
              <button class="secondary-btn" type="button" data-open-generated="${person.id}">Открыть досье</button>
              <button class="secondary-btn" type="button" data-add-bitrix="${person.id}">Добавить в Bitrix</button>
            </div>
          </div>
        `;
      }).join('');
      return `<div class="result-stack">${cards}</div>`;
    }

    function renderResearchReport(report) {
      if (!report) return '';
      const attention = report.attention || null;
      const pipeline = (report.pipeline || []).map(step => `
        <div class="report-item">
          <small>Шаг</small>
          <div>${step}</div>
        </div>
      `).join('');
      const sources = (report.sourceTargets || []).map(source => `
        <div class="report-item">
          <small>${source.title}</small>
          <div>${source.why}</div>
        </div>
      `).join('');
      const queries = (report.searchQueries || []).slice(0, 6).map(query => `
        <div class="score-pill">${query}</div>
      `).join('');
      const missing = (report.missingUnion || []).length
        ? report.missingUnion.map(item => `<div class="score-pill">${item}</div>`).join('')
        : '<div class="score-pill">нет явных дыр</div>';
      const candidates = (report.candidateReports || []).map(candidate => `
        <div class="report-item">
          <small>${candidate.name}</small>
          <div>${candidate.role} · ${candidate.confidence}% confidence</div>
          <div>${candidate.summary || '—'}</div>
          <div>${(candidate.missing || []).length ? `Дырки: ${(candidate.missing || []).join(', ')}` : 'Дырок почти нет'}</div>
        </div>
      `).join('');
      const bitrixPreview = report.candidateReports && report.candidateReports[0]
        ? report.candidateReports[0].bitrixPreview || {}
        : {};
      const bitrixPreviewSummary = bitrixPreview.summary
        || bitrixPreview.note
        || bitrixPreview.overview
        || bitrixPreview.shortSummary
        || 'Готово к привязке к Bitrix без показа сырых полей.';
      const attentionCards = attention
        ? attention.top.map(item => `
            <div class="report-item">
              <small>${item.name}</small>
              <div>${item.role} · ${item.score}/100</div>
              <div>${item.reason}</div>
              <div>${item.nextAction}</div>
            </div>
          `).join('')
        : '';
      return `
        <div class="research-report">
          ${attention ? `
            <div class="report-card primary">
              <div class="report-head">
                <span>${attention.title}</span>
                <span>attention</span>
              </div>
              <div class="report-value">${attention.summary}</div>
              <div class="timeline-note">${attention.message}</div>
              <div class="report-list">${attentionCards}</div>
            </div>
          ` : ''}
          <div class="report-grid">
            <div class="report-card primary">
              <div class="report-head">
                <span>Парсинг-вердикт</span>
                <span>${report.intent || 'general'}</span>
              </div>
              <div class="report-value">${report.summary || 'Система собрала пылесос-пакет: источники, факты, связи и поля для Bitrix.'}</div>
              <div class="report-list">${pipeline}</div>
            </div>
            <div class="report-card">
              <div class="report-head">
                <span>Что еще добрать</span>
                <span>${(report.missingUnion || []).length} gaps</span>
              </div>
              <div class="score-row">${missing}</div>
              <div class="report-head" style="margin-top:4px;">
                <span>Поисковые запросы</span>
                <span>${(report.searchQueries || []).length}</span>
              </div>
              <div class="score-row">${queries}</div>
            </div>
          </div>

          <div class="report-grid">
            <div class="report-card">
              <div class="report-head">
                <span>Источник-план</span>
                <span>${(report.sourceTargets || []).length}</span>
              </div>
              <div class="report-list">${sources}</div>
            </div>
            <div class="report-card">
              <div class="report-head">
                <span>Готово к Bitrix</span>
                <span>${bitrixPreviewSummary ? 'summary' : 'empty'}</span>
              </div>
              <div class="report-value">${bitrixPreviewSummary}</div>
            </div>
          </div>

          <div class="report-card">
            <div class="report-head">
              <span>Кандидаты после парсинга</span>
              <span>${(report.candidateReports || []).length}</span>
            </div>
            <div class="report-list">${candidates}</div>
            <div class="timeline-note">${(report.nextActions || []).join(' ')}</div>
          </div>
        </div>
      `;
    }

    function bindGeneratedResultActions(container) {
      container.querySelectorAll('[data-open-known]').forEach(button => {
        button.addEventListener('click', () => openCard(data[button.dataset.openKnown]));
      });
      container.querySelectorAll('[data-open-generated]').forEach(button => {
        button.addEventListener('click', () => openCard(data[button.dataset.openGenerated]));
      });
      container.querySelectorAll('[data-add-bitrix]').forEach(button => {
        button.addEventListener('click', () => addCandidateToBitrix(button.dataset.addBitrix));
      });
    }

    async function routeQueryWithBackend(text) {
      const knownMatches = scoreKnownContacts(text);
      if (knownMatches.length === 1 && looksLikeDirectContactLookup(text, knownMatches[0])) {
        const person = knownMatches[0];
        append('bot', `Нашёл в базе: ${person.name}. Открываю карточку сразу.`);
        openCard(person);
        return;
      }
      if (knownMatches.length > 1) {
        append('bot', 'Нашёл несколько уже добавленных контактов по этому запросу. Выбери нужного человека.');
        const el = append('bot', renderKnownContactChoices(knownMatches.slice(0, 5)), true);
        bindGeneratedResultActions(el);
        return;
      }

      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, placement, placementOptions })
      });
      const result = await response.json();
      if (!response.ok || result.error) throw new Error(result.error || 'Backend вернул ошибку');
      const candidates = result.candidates || [];
      const research = result.research || null;
      const attention = result.attention || null;
      rememberCandidates(candidates);
      append('bot', result.answer || 'Готово.');
      if (attention) {
        const attentionBody = `
          <div class="research-report">
            <div class="report-card primary">
              <div class="report-head">
                <span>${attention.title}</span>
                <span>CRM priority</span>
              </div>
              <div class="report-value">${attention.summary}</div>
              <div class="timeline-note">${attention.message}</div>
              <div class="report-list">
                ${(attention.top || []).map(item => `
                  <div class="report-item">
                    <small>${item.name}</small>
                    <div>${item.role} · ${item.score}/100</div>
                    <div>${item.reason}</div>
                    <div>Стадия CRM: ${item.stageHint}</div>
                    <div>Следующий шаг: ${item.nextAction}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        append('bot', attentionBody, true);
      }
      if (research) {
        const reportEl = append('bot', renderResearchReport(research), true);
        bindGeneratedResultActions(reportEl);
      }
      if (candidates.length) {
        const el = append('bot', renderCandidateResults(candidates), true);
        bindGeneratedResultActions(el);
      }
    }

    function analyzePerson(person) {
      const label = person.name;
      const rels = person.cloud.map(c => c.label).slice(0, 4).join(', ');
      const signals = person.posts.map(p => p[1]).slice(0, 2).join('; ');
      return `${label} выглядит как ${person.role.toLowerCase()}. У него сильные пересечения с ${rels}. Последние сигналы: ${signals}.`;
    }

    function buildPostIdea(person) {
      return `Идея для поста про ${person.name}: показать не только релиз, но и процесс, связи и людей вокруг него. Формат: короткий сторителлинг + 3 факта + визуальный акцент на коллаборации.`;
    }

    function buildPostText(person) {
      return `Новый релиз от ${person.name} уже тут.\n\nЭто история про ${person.role.toLowerCase()} и людей, которые стоят за звуком. ${person.summary}\n\nСохрани, если тебе близок этот вайб.`;
    }

    function buildReleaseDigest() {
      const releases = Object.values(data)
        .flatMap(person => person.posts.map(post => ({ person: person.name, title: post[1], desc: post[2] })))
        .slice(0, 5);
      return releases.map(item => `• ${item.person}: ${item.title} — ${item.desc}`).join('\n');
    }

    window.addEventListener('message', (event) => {
      const message = event.data || {};
      if (!message || typeof message !== 'object') return;

      if (message.type === 'carte:set-context') {
        if (message.runtime && typeof message.runtime === 'object') {
          if (message.runtime.placement) runtime.placement = message.runtime.placement;
          if (message.runtime.placementOptions) runtime.placementOptions = message.runtime.placementOptions;
          if (message.runtime.memberId) runtime.memberId = message.runtime.memberId;
          if (typeof message.runtime.mobile === 'boolean') runtime.mobile = message.runtime.mobile;
        }
        if (typeof message.search === 'string') setSearchQuery(message.search);
        if (typeof message.typeName === 'string') setContactFilter(message.typeName);
        if (typeof message.tab === 'string') setTab(message.tab);
        if (runtime.mobile) document.body.classList.add('mobile-mode');
      }

      if (message.type === 'carte:open-contact') {
        openContactById(message.id);
      }

      if (message.type === 'carte:open-tab' && typeof message.tab === 'string') {
        setTab(message.tab);
      }

      if (message.type === 'carte:set-search') {
        setSearchQuery(message.query || '');
      }

      if (message.type === 'carte:set-filter') {
        setContactFilter(message.filter || 'все');
      }
    });

    function routeQuery(text) {
      const lower = text.toLowerCase();
      const contacts = matchContacts(text);

      if (isAttentionQuery(text)) {
        append('bot', `Кому писать сейчас:\n${buildAttentionDigest()}`);
        return;
      }

      if (lower.includes('покажи') || lower.includes('контакт') || lower.includes('найди') || lower.includes('верифицируй')) {
        if (contacts.length) {
          append('bot', `Нашёл ${contacts.length} совпадений:\n${summarizeContacts(contacts.slice(0, 5))}`);
          showResultLink(contacts[0].name, contacts[0].id);
          setTab('contacts');
          activeType = 'все';
          activeFilter.textContent = activeType;
          search.value = '';
          activeQuery = '';
          renderFilters();
          renderContacts();
          return;
        }
      }

      if (lower.includes('релиз')) {
        append('bot', `Собрал последние релизы:\n${buildReleaseDigest()}`);
        return;
      }

      if (lower.includes('анализ') || lower.includes('разбери пост') || lower.includes('посты')) {
        if (contacts.length) {
          append('bot', `Анализ постов по ${contacts[0].name}:\n${analyzePerson(contacts[0])}`);
          showResultLink(contacts[0].name, contacts[0].id);
        } else {
          append('bot', 'Сначала укажи контакт, по которому нужен анализ постов.');
        }
        return;
      }

      if (lower.includes('идея') || lower.includes('придумай пост')) {
        const person = contacts[0] || data.fargo;
        append('bot', buildPostIdea(person));
        showResultLink(person.name, person.id);
        return;
      }

      if (lower.includes('текст') || lower.includes('напиши пост')) {
        const person = contacts[0] || data.fargo;
        append('bot', buildPostText(person));
        showResultLink(person.name, person.id);
        return;
      }

      if (lower.includes('связ')) {
        const person = contacts[0] || data.fargo;
        append('bot', `Связи по ${person.name}:\n${person.cloud.map(item => `• ${item.label}`).join('\n')}`);
        showResultLink(person.name, person.id);
        return;
      }

      if (contacts.length) {
        append('bot', `Нашёл контакт: ${contacts[0].name}. Открываю карточку.`);
        showResultLink(contacts[0].name, contacts[0].id);
        return;
      }

      append('bot', 'Принял. Я умею искать контакты, собирать релизы, анализировать посты, генерировать идеи и тексты, а потом вести это к CRM.');
    }

    tabs.forEach(tab => tab.addEventListener('click', () => setTab(tab.dataset.tab)));

    send.addEventListener('click', async () => {
      const text = prompt.value.trim();
      if (!text) return;
      append('user', text);
      send.disabled = true;
      send.textContent = 'Ищу';
      try {
        await routeQueryWithBackend(text);
      } catch (error) {
        append('system', `Локальный backend недоступен: ${error.message}. Отвечаю демо-логикой из интерфейса.`);
        routeQuery(text);
      } finally {
        send.disabled = false;
        send.textContent = 'Отправить';
      }
      prompt.value = '';
      prompt.focus();
    });

    search.addEventListener('input', () => {
      activeQuery = search.value.trim().toLowerCase();
      renderContacts();
      saveState();
    });

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    prompt.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        send.click();
      }
    });

    loadState();
    search.value = activeQuery;
    activeFilter.textContent = activeType;
    renderFilters();
    renderContacts();
    loadBitrixContext();
    if (placement && placement.startsWith('CRM_')) {
      setTab('contacts');
    } else {
      setTab(activeTab);
    }
    sendRuntimeReady();
  </script>
</body>
</html>
